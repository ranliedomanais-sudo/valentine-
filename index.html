<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💘</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    .card {
        background: white;
        padding: 30px 25px;
        border-radius: 25px;
        text-align: center;
        width: 90%;
        max-width: 380px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        animation: pop 0.6s ease;
        position: relative;
    }

    @keyframes pop {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    h1 {
        color: #ff4d6d;
        font-size: 1.8em;
        margin-bottom: 10px;
    }

    h2 {
        color: #ff758f;
        font-size: 1.15em;
        margin-bottom: 15px;
    }

    p {
        font-size: 1.05em;
        color: #555;
        margin-bottom: 25px;
        line-height: 1.45em;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        position: relative;
    }

    button {
        padding: 12px 25px;
        font-size: 1em;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: 0.3s;
        min-width: 120px;
    }

    #yes {
        background: #ff4d6d;
        color: white;
        z-index: 2;
    }

    #yes:hover {
        transform: scale(1.08);
    }

    #no {
        background: #eee;
        color: #333;
        position: fixed; /* IMPORTANT */
        left: 50%;
        top: 70%;
        transform: translate(-50%, -50%);
        z-index: 1;
        pointer-events: none; /* IMPOSSIBLE TO CLICK */
    }

    .heart {
        position: fixed;
        font-size: 22px;
        animation: floatUp 3s linear forwards;
    }

    @keyframes floatUp {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-120px); opacity: 0; }
    }
</style>
</head>

<body>

<!-- Autoplay music (intentionally silent) -->
<audio autoplay loop muted></audio>

<div class="card" id="card">
    <h1>💘 Hi Angel Gwyneth D. Sanchez l 💘</h1>
    <h2>Important Question Ahead 🚨</h2>

    <p>
        I thought about this very carefully  
        (okay maybe not *that* carefully),
        and I reached a very serious conclusion:
        <br><br>
        You should absolutely be my Valentine 🥰
    </p>

    <div class="buttons">
        <button id="yes">Yes 💖</button>
        <button id="no">No 🙃</button>
    </div>
</div>

<script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const card = document.getElementById("card");

    // NO BUTTON IS FOREVER IMPOSSIBLE
    function teleportNo() {
        const padding = 50;
        const x = Math.random() * (window.innerWidth - padding);
        const y = Math.random() * (window.innerHeight - padding);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }

    // Teleport constantly so it can NEVER be caught
    setInterval(teleportNo, 600);

    // Extra safety: teleport on any attempt
    document.addEventListener("mousemove", teleportNo);
    document.addEventListener("touchstart", teleportNo);
    document.addEventListener("keydown", teleportNo);

    yesBtn.addEventListener("click", () => {
        card.innerHTML = `
            <h1>🥰 YAYYYYY 🥰</h1>
            <p>
                Correct choice 😌💖<br><br>
                You are now officially my Valentine.
                No take-backs.
                No refunds.
                No escape.
                <br><br>
                Expect smiles, laughs,
                and snacks 🍟🍫
            </p>
        `;
        launchHearts();
    });

    function launchHearts() {
        setInterval(() => {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = "💖";
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.bottom = "0px";
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 3000);
        }, 250);
    }
</script>

</body>
  </html>
